<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Miembros</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="main-container">
        <div id="val-box" class="oculto">
            <h2 id="val-msg">Han ocurrido los siguiente errores:</h2>
            <ul id="val-list"></ul>
        </div>
            
        <form id="form-registro">
            <div class="grupo-input">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Ronaldinho Gaucho">
            </div>

            <div class="grupo-input">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@domio.cl">
            </div>

            <div class="grupo-input">
                <label for="telefono">Número de teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 912345678">
            </div>

            <div class="grupo-input">
                <label for="tipo-miembro">Tipo de miembro:</label>
                <select id="tipo-miembro" name="tipo-miembro">
                    <option value="">Seleccione un tipo</option>
                    <option value="estudiante">Estudiante</option>
                    <option value="profesor">Profesor</option>
                    <option value="administrativo">Administrativo</option>
                </select>
            </div>

            <div id="seccion-estudiante" class="oculto">
                <div class="grupo-input">
                    <label for="carrera">Carrera que cursa:</label>
                    <select id="carrera" name="carrera">
                        <option value="">Seleccione su carrera</option>
                        <option value="plan-comun">Plan Común</option>
                        <option value="lic-fisica">Licenciatura en Ciencias, mención Física</option>
                        <option value="lic-astronomia">Licenciatura en Ciencias, mención Astronomía</option>
                        <option value="civil-computacion">Ingeniería Civil en Computación</option>
                        <option value="civil-industrial">Ingeniería Civil Industrial</option>
                        <option value="civil-minas">Ingeniería Civil de Minas</option>
                        <option value="civil-matematica">Ingeniería Civil Matemática</option>
                        <option value="civil-mecanica">Ingeniería Civil Mecánica</option>
                        <option value="civil-electrica">Ingeniería Civil Eléctrica</option>
                        <option value="civil-quimica">Ingeniería Civil Química</option>
                        <option value="civil-biotecnologia">Ingeniería Civil en Biotecnología</option>
                        <option value="civil-fisica">Ingeniería Civil Física</option>
                        <option value="civil-geofisica">Ingeniería Civil Geofísica</option>
                        <option value="civil">Ingeniería Civil</option>
                        <option value="geologia">Geología</option>
                        <option value="post-grado">Postgrado</option>
                    </select>
                </div>
            </div>

            <div id="seccion-profesor" class="oculto">
                <div class="grupo-input">
                    <label for="departamento">Departamento al que pertenece:</label>
                    <select id="departamento" name="departamento">
                        <option value="">Seleccione su departamento</option>
                        <option value="dcc">Ciencias de la Computación (DCC)</option>
                        <option value="die">Ingeniería Eléctrica (DIE)</option>
                        <option value="dii">Ingeniería Industrial (DII)</option>
                        <option value="dim">Ingeniería Matemática (DIM)</option>
                        <option value="dimin">Ingeniería de Minas (DIMIN)</option>
                        <option value="dgf">Geofísica (DGF)</option>
                        <option value="dg">Geología (DG)</option>
                        <option value="dfi">Física (DFI)</option>
                        <option value="das">Astronomía (DAS)</option>
                        <option value="diqbm">Ingeniería Química, Biotecnología y Materiales (DIQBM)</option>
                        <option value="dic">Ingeniería Civil (DIC)</option>
                        <option value="dimec">Ingeniería Mecánica (DIMEC)</option>
                    </select>
                </div>
            </div>

            <button id="submit-btn" type="button">Enviar</button>
        </form>

        <nav>
            <a href="{{ url_for('informar_actividad') }}">Informar nueva actividad</a> |
            <a href="{{ url_for('lista_miembros') }}">Ver lista de miembros</a> |
            <a href="{{ url_for('consulta_metricas') }}">Consultar métricas</a> |
            <a href="{{ url_for('index') }}">Volver al inicio</a>
        </nav>
    </div>

    <script src="{{ url_for('static', filename='js/validation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/select.js') }}"></script>
</body>
</html>
