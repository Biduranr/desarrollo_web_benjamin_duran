<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Miembros</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="main-container">
        <h1>Lista de Miembros</h1>
        <div class="controles-lista">
            <label for="filtro-tipo">Filtrar por:</label>
            <select id="filtro-tipo">
                <option value="todos">Todos</option>
                <option value="Estudiante">Estudiantes</option>
                <option value="Profesor">Profesores</option>
                <option value="Administrativo">Administrativos</option>
            </select>

            <label for="ordenar-por">Ordenar por:</label>
            <select id="ordenar-por">
                <option value="nombre-asc">Nombre (A-Z)</option>
                <option value="nombre-desc">Nombre (Z-A)</option>
                <option value="email">Email</option>
            </select>
        </div>
        
        <table id="tabla-miembros">
            <thead>
                <tr>
                    <th>Nombre</th> 
                    <th>Correo electrónico</th> 
                    <th>Número de teléfono</th>
                    <th>Tipo de miembro</th>
                    <th>Carrera/Departamento (si es estudiante o profesor)</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                <!-- Aquí se agregarán los miembros registrados -->
            </tbody>
            <p id="msje-vacio" class="oculto">No hay miembros registrados todavía .</p>
        </table>

        <nav>
            <a href="{{ url_for('registro_miembros') }}">Registrar nuevo miembro</a> |
            <a href="{{ url_for('informar_actividad') }}">Informar nueva actividad</a> |
            <a href="{{ url_for('consulta_metricas') }}">Consultar métricas</a> |
            <a href="{{ url_for('index') }}">Volver al inicio</a>
        </nav>

        <div id="paginacion">
            <button id="prev-btn">Anterior</button>
            <span id="pagina-actual">Página 1</span>
            <button id="next-btn">Siguiente</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/display-members.js') }}"></script>
</body>
</html>
